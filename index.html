не собираюсь отменять свои планы на поездку','Es fundamental que todos los ciudadanos ejerzan su derecho al voto con responsabilidad-Крайне важно, чтобы все граждане ответственно осуществляли своё право голоса','Tan pronto como me gradúe, buscaré empleo en el extranjero para adquirir experiencia-Как только я закончу учёбу, я буду искать работу за границей, чтобы приобрести опыт','Me molestó profundamente que no me invitaras a tu boda después de tantos años de amistad-Меня глубоко возмутило, что ты не пригласил меня на свою свадьбу после стольких лет дружбы','Cuesta creer que haya gente capaz de maltratar a los animales sin sentir ningún remordimiento-Трудно поверить, что есть люди, способные жестоко обращаться с животными, не испытывая угрызений совести','Cuando termine la crisis económica, veremos cómo se recupera el mercado laboral-Когда экономический кризис закончится, мы увидим, как восстанавливается рынок труда','Dudo mucho que las empresas tomen medidas reales contra el cambio climático sin una regulación estricta-Я сильно сомневаюсь, что компании предпримут реальные меры против изменения климата без строгого регулирования','A pesar de que llovía a cántaros, decidieron seguir con la manifestación programada-Несмотря на то что лил как из ведра, они решили продолжить запланированную демонстрацию','El gobierno debería invertir más en energías renovables, tal y como han hecho otros países europeos-Правительство должно больше инвестировать в возобновляемую энергию, как это сделали другие европейские страны','No me parece justo que los jóvenes tengan que emigrar para encontrar oportunidades laborales dignas-Мне не кажется справедливым, что молодые люди вынуждены эмигрировать, чтобы найти достойные возможности для работы','Si hubiésemos tomado medidas preventivas antes, la pandemia no nos habría afectado tan duramente-Если бы мы приняли профилактические меры раньше, пандемия не затронула бы нас так сильно','Se rumorea que la empresa multinacional pretende deslocalizar su producción a países con mano de obra más barata-Ходят слухи, что транснациональная компания намерена перенести своё производство в страны с более дешёвой рабочей силой','Mientras los políticos sigan prometiendo sin cumplir, la desconfianza ciudadana no hará más que aumentar-Пока политики продолжают обещать и не выполнять, недоверие граждан будет только расти','A decir verdad, prefiero vivir en una ciudad pequeña y tranquila que en una metrópolis ruidosa y estresante-Честно говоря, я предпочитаю жить в маленьком тихом городе, чем в шумном и стрессовом мегаполисе','Cuando me hablaron del proyecto, no imaginé que llegaría a tener tanto éxito-Когда мне рассказали о проекте, я не представлял, что он будет иметь такой успех','Era inevitable que tarde o temprano se descubriera el fraude financiero que habían estado cometiendo-Было неизбежно, что рано или поздно раскроется финансовое мошенничество, которое они совершали','Es probable que para el año que viene hayan desarrollado una vacuna eficaz contra esta enfermedad-Вероятно, к следующему году они разработают эффективную вакцину против этой болезни','A menudo me pregunto qué habría sido de mi vida si hubiera aceptado aquel trabajo en el extranjero-Часто я спрашиваю себя, что было бы с моей жизнью, если бы я принял ту работу за границей','Aunque no lo parezca, aprender un idioma nuevo requiere mucha disciplina y constancia-Хотя это может не казаться, изучение нового языка требует большой дисциплины и постоянства','Basta con que mires las estadísticas para darte cuenta de la gravedad del problema de la desigualdad económica-Достаточно посмотреть на статистику, чтобы осознать серьёзность проблемы экономического неравенства','Nunca pensé que llegarías a ser una persona tan influyente en el mundo de la ciencia-Никогда не думал, что ты станешь таким влиятельным человеком в мире науки','Se están agotando los recursos naturales del planeta a un ritmo alarmante, y pocos parecen preocuparse de verdad-Природные ресурсы планеты истощаются с тревожной скоростью, и немногие, кажется, действительно обеспокоены','La semana pasada nos pusieron una multa por no separar correctamente los residuos, algo totalmente evitable-На прошлой неделе нам выписали штраф за неправильное разделение отходов, что было совершенно предотвратимо','Sería maravilloso que todos los gobiernos del mundo colaboraran para erradicar el hambre y la pobreza extrema-Было бы замечательно, если бы все правительства мира сотрудничали ради искоренения голода и крайней нищеты','Se habla mucho de inteligencia artificial, pero muy poca gente entiende realmente cómo funciona-Много говорят об искусственном интеллекте, но очень немногие действительно понимают, как он работает','Antes de que tomes una decisión tan importante, deberías consultar con un especialista que te oriente-Прежде чем принять такое важное решение, тебе следовало бы посоветоваться со специалистом, который направит тебя','El simple hecho de que exista discriminación racial en el siglo XXI me parece absolutamente indignante-Сам факт того, что расовая дискриминация существует в XXI веке, кажется мне абсолютно возмутительным','Aunque no te guste la política, las decisiones que toman los gobernantes afectan directamente tu vida diaria-Хотя тебе не нравится политика, решения, которые принимают правители, напрямую влияют на твою повседневную жизнь','Tan pronto como escuché las noticias, me puse en contacto con mi familia para asegurarme de que estaban bien-Как только я услышал новости, я связался со своей семьёй, чтобы убедиться, что у них всё в порядке','No solo es importante tener un título universitario, sino también desarrollar habilidades prácticas que demanda el mercado-Важно не только иметь диплом о высшем образовании, но и развивать практические навыки, которые востребованы рынком','Los expertos advierten que, de seguir contaminando al ritmo actual, el planeta alcanzará un punto de no retorno-Эксперты предупреждают: если продолжать загрязнять в нынешнем темпе, планета достигнет точки невозврата','Se trata de una oportunidad única que difícilmente se volverá a presentar, así que deberías aprovecharla sin miedo-Это уникальная возможность, которая вряд ли повторится, так что тебе следует воспользоваться ей без страха','Antes solía pensar que el éxito profesional era lo más importante, pero con los años cambié completamente mi escala de valores-Раньше я думал, что профессиональный успех – это самое важное, но с годами я полностью изменил свою шкалу ценностей','Me irrita sobremanera la gente que habla sin saber y encima presume de tener siempre la razón-Меня сильно раздражают люди, которые говорят, не зная, и вдобавок хвастаются тем, что всегда правы','El alcalde prometió que arreglarían las calles antes del invierno, pero ya estamos en primavera y siguen igual-Мэр обещал, что они починят улицы до зимы, но уже весна, а они всё такие же','Después de reflexionar largamente, he llegado a la conclusión de que debo priorizar mi salud mental antes que las presiones laborales-После долгих размышлений я пришёл к выводу, что должен ставить своё психическое здоровье выше рабочих нагрузок','Si tuviera la posibilidad, invertiría en proyectos sociales que beneficien a las comunidades más desfavorecidas-Если бы у меня была возможность, я бы инвестировал в социальные проекты, приносящие пользу наиболее обездоленным сообществам','No es que no quiera ayudarte, es que en este momento tengo demasiados compromisos que no puedo aplazar-Не то чтобы я не хотел тебе помочь, просто у меня сейчас слишком много обязательств, которые я не могу отложить','Tras analizar los pros y los contras, me he decidido a aceptar la oferta y mudarme a otra ciudad-Проанализировав все за и против, я решился принять предложение и переехать в другой город','En cuanto la situación económica mejore, muchas familias podrán permitirse comprar una vivienda digna-Как только экономическая ситуация улучшится, многие семьи смогут позволить себе купить достойное жильё','Aunque me duele admitirlo, reconozco que cometí un error al no hacer caso a tus consejos-Хотя мне больно это признавать, я признаю, что совершил ошибку, не прислушавшись к твоим советам','Sería mucho más eficiente que todas las administraciones compartieran sus datos y colaboraran en lugar de trabajar por separado-Было бы гораздо эффективнее, если бы все администрации обменивались данными и сотрудничали, а не работали по отдельности','Nadie puede negar que el cambio climático es una realidad alarmante, y sin embargo seguimos actuando como si nada-Никто не может отрицать, что изменение климата – это тревожная реальность, и тем не менее мы продолжаем действовать, как ни в чём не бывало', 'Si te hubiera escuchado antes, ahora no estaría lamentando esta situación-Если бы я послушал тебя раньше, сейчас бы не сожалел об этой ситуации','Tan pronto como termine este proyecto, me tomaré unas merecidas vacaciones en la playa-Как только я закончу этот проект, я возьму заслуженный отпуск на пляже','Resulta paradójico que tengamos tecnología tan avanzada y sigamos sin resolver problemas básicos como el hambre en el mundo-Это парадоксально, что у нас есть такие продвинутые технологии, а мы всё ещё не решаем базовые проблемы, такие как голод в мире','A pesar de que me advirtieron del peligro, decidí arriesgarme y al final todo salió bien-Несмотря на то что меня предупредили об опасности, я решил рискнуть, и в итоге всё обошлось','No soporto a aquellos que presumen de su inteligencia pero carecen por completo de empatía-Я не выношу тех, кто хвастается своим интеллектом, но им полностью не хватает эмпатии','Espero que para el próximo año hayamos conseguido reducir nuestra huella de carbono como comunidad-Надеюсь, к следующему году мы как сообщество смогли сократить наш углеродный след','Me da mucha rabia que cancelaran el concierto a última hora sin dar ninguna explicación razonable-Меня очень злит, что они отменили концерт в последнюю минуту, не дав никаких разумных объяснений','Cada vez que viajo al extranjero, valoro más la riqueza cultural de mi propio país-Каждый раз, когда я путешествую за границу, я больше ценю культурное богатство своей собственной страны','El problema no es que no tengamos recursos, sino que no sabemos gestionarlos adecuadamente-Проблема не в том, что у нас нет ресурсов, а в том, что мы не умеем ими правильно управлять','Si hubiera sabido que la entrevista de trabajo iba a ser tan exigente, me habría preparado mucho más-Если бы я знал, что собеседование при приёме на работу будет таким требовательным, я бы подготовился гораздо больше','Me parece fascinante cómo el ser humano es capaz de adaptarse a condiciones extremas con tal de sobrevivir-Мне кажется увлекательным, как человек способен адаптироваться к экстремальным условиям ради выживания','Antes de que tomes una decisión tan drástica, te ruego que medites profundamente sobre las consecuencias-Прежде чем ты примешь такое радикальное решение, умоляю тебя глубоко обдумать последствия','No se trata solo de ganar dinero, sino de encontrar un propósito que le dé sentido a tu vida-Дело не только в том, чтобы зарабатывать деньги, а в том, чтобы найти цель, придающую смысл твоей жизни','En cuanto vi la oportunidad, no lo dudé ni un segundo y presenté mi candidatura-Как только я увидел возможность, я не колебался ни секунды и подал свою кандидатуру','Aunque el camino sea difícil, estoy decidido a seguir adelante sin mirar atrás-Хотя путь будет трудным, я полон решимости идти вперёд, не оглядываясь','Sería maravilloso que la sociedad dejara de estigmatizar a las personas que sufren trastornos mentales-Было бы замечательно, если бы общество перестало стигматизировать людей, страдающих психическими расстройствами','No es que no te quiera prestar el dinero, es que ahora mismo no dispongo de esa cantidad-Не то чтобы я не хотел одолжить тебе деньги, просто сейчас у меня нет такой суммы','Me horroriza pensar que aún haya personas que nieguen la evidencia científica del cambio climático-Меня ужасает мысль, что ещё есть люди, отрицающие научные доказательства изменения климата','Hace tiempo que vengo notando que tu actitud ha cambiado, pero no quería sacar el tema-Уже давно я замечаю, что твоё отношение изменилось, но я не хотел поднимать эту тему','Después de mucho reflexionar, he decidido que lo mejor es alejarme de esta relación tóxica-После долгих размышлений я решил, что лучшее — уйти из этих токсичных отношений','Los datos indican que, de seguir así, los glaciares desaparecerán por completo en menos de cincuenta años-Данные показывают, что, если так продолжится, ледники полностью исчезнут менее чем через пятьдесят лет','Ojalá existiera una fórmula mágica para aprender idiomas sin esfuerzo, pero la realidad es muy distinta-Если бы существовала волшебная формула для изучения языков без усилий, но реальность совсем иная','No solo suspendió el examen, sino que además perdió la beca por su falta de compromiso-Он не только провалил экзамен, но и потерял стипендию из-за своего отсутствия вовлечённости','Te recomiendo que dejes de procrastinar y empieces a organizar mejor tu tiempo si quieres alcanzar tus metas-Я рекомендую тебе перестать откладывать дела и начать лучше организовывать своё время, если хочешь достичь своих целей','Mucha gente habla de igualdad, pero a la hora de actuar demuestran prejuicios muy arraigados-Многие люди говорят о равенстве, но, когда дело доходит до действий, проявляют глубоко укоренившиеся предрассудки','Cuando llegué a casa y vi que las ventanas estaban rotas, supe inmediatamente que nos habían robado-Когда я пришёл домой и увидел, что окна разбиты, я сразу понял, что нас ограбили','El simple hecho de que existan guerras en el siglo XXI demuestra que la humanidad no ha aprendido nada de sus errores pasados-Сам факт существования войн в XXI веке доказывает, что человечество ничему не научилось из своих прошлых ошибок','Bastaría con que cada persona reciclara su basura para notar una gran diferencia en el medio ambiente-Было бы достаточно, чтобы каждый человек перерабатывал свой мусор, чтобы заметить большую разницу в окружающей среде','Ni siquiera me molesté en responder a sus acusaciones porque sabía que era un pulso completamente perdido-Я даже не стал утруждать себя ответом на его обвинения, потому что знал, что это совершенно безнадёжный спор','Se han invertido millones en publicidad engañosa y los consumidores cada vez confían menos en las grandes marcas-Были вложены миллионы в обманчивую рекламу, и потребители всё меньше доверяют крупным брендам','Si mañana me dijeran que me queda un año de vida, lo primero que haría sería viajar y despedirme de todos los que quiero-Если бы завтра мне сказали, что мне остался год жизни, первым делом я бы отправился в путешествие и попрощался со всеми, кого люблю','No entiendo cómo puedes tolerar que te traten de esa manera tan despectiva sin protestar-Я не понимаю, как ты можешь терпеть, что с тобой обращаются так пренебрежительно, не протестуя','Es vital que los adolescentes reciban educación sexual integral para prevenir embarazos no deseados y enfermedades-Жизненно важно, чтобы подростки получали всестороннее половое воспитание для предотвращения нежелательных беременностей и болезней','Después de haberlo pensado fríamente, me di cuenta de que tenía razón y decidí disculparme-После того как я хладнокровно обдумал это, я понял, что он был прав, и решил извиниться','La conferencia resultó ser mucho más interesante de lo que esperaba, aunque los ponentes hablaron demasiado deprisa en ocasiones-Конференция оказалась гораздо интереснее, чем я ожидал, хотя иногда докладчики говорили слишком быстро','No creo que cambien la ley a pesar de las numerosas protestas ciudadanas que han tenido lugar-Я не думаю, что они изменят закон, несмотря на многочисленные гражданские протесты, которые имели место','Conforme pasan los años, me doy más cuenta de lo efímera que es la vida y de lo importante que es disfrutar cada momento-С годами я всё больше осознаю, как быстротечна жизнь и как важно наслаждаться каждым моментом','Siempre que me surge un problema difícil, trato de dividirlo en partes más pequeñas para resolverlo con mayor facilidad-Каждый раз, когда у меня возникает трудная проблема, я пытаюсь разбить её на более мелкие части, чтобы легче её решить','Estaría dispuesto a ayudarte con la mudanza con tal de que no me pidas que conduzca tu furgoneta, que me da pánico-Я был бы готов помочь тебе с переездом при условии, что ты не попросишь меня вести твой фургон, от которого меня бросает в дрожь','Había una energía tan tensa en la sala que nadie se atrevía a romper el silencio-В комнате была такая напряжённая атмосфера, что никто не осмеливался нарушить тишину','Aunque parezca mentira, aquel chico tímido del instituto acabó convirtiéndose en un empresario muy exitoso-Хотя это может показаться невероятным, тот застенчивый парень из школы в итоге стал очень успешным предпринимателем','Por muy difícil que parezca la situación, siempre hay una salida si mantienes la calma y piensas con claridad-Какой бы трудной ни казалась ситуация, всегда есть выход, если сохранять спокойствие и мыслить ясно','No deberías fiarte de los que solo aparecen cuando necesitan algo y desaparecen cuando eres tú quien requiere ayuda-Тебе не следует доверять тем, кто появляется только тогда, когда им что-то нужно, и исчезает, когда помощь нужна тебе','Cuando llegó el momento de la verdad, demostró ser mucho más valiente de lo que todos imaginaban-Когда наступил момент истины, он оказался гораздо храбрее, чем все предполагали','La situación es tan grave que resulta imposible seguir mirando hacia otro lado sin sentir remordimientos-Ситуация настолько серьезна, что невозможно продолжать смотреть в другую сторону без угрызений совести','Sería mucho más beneficioso para todos que las empresas priorizaran el bienestar de sus empleados antes que los beneficios económicos-Было бы гораздо выгоднее для всех, если бы компании ставили благополучие своих сотрудников выше экономической прибыли', 'Si hubiera estudiado más durante la carrera, ahora tendría más salidas profesionales-Если бы я больше учился во время учёбы, сейчас у меня было бы больше карьерных возможностей','No me parece ético que las grandes corporaciones evadan impuestos mientras los ciudadanos de a pie sufren los recortes-Мне не кажется этичным, что крупные корпораciones уклоняются от налогов, в то время как простые граждане страдают от сокращений','A medida que envejecemos, nos damos cuenta de que la salud es el único bien verdaderamente valioso-С возрастом мы понимаем, что здоровье — единственное по-настоящему ценное благо','Te aseguro que si hubiera visto la oportunidad, la habría aprovechado sin pensarlo dos veces-Я уверяю тебя, если бы я увидел возможность, я бы воспользовался ею, не думая дважды','Por muy cansado que estés, deberías terminar al menos el informe antes de irte a casa-Каким бы уставшим ты ни был, тебе стоит закончить хотя бы отчёт, прежде чем идти домой','Tan pronto como el jefe se enteró del error, convocó una reunión urgente con todo el equipo-Как только начальник узнал об ошибке, он срочно созвал встречу со всей командой','No soporto la hipocresía de aquellos que critican a los demás por hacer exactamente lo que ellos mismos practican a escondidas-Я не выношу лицемерия тех, кто критикует других за то, что они сами практикуют тайком','Resulta irónico que los políticos hablen de transparencia cuando después ocultan información crucial a la ciudadanía-Это иронично, что политики говорят о прозрачности, когда потом скрывают от гражданства ключевую информацию','Después de tanto tiempo sin vernos, me alegra comprobar que algunos lazos de amistad no se rompen con la distancia-После столь долгого времени без встреч мне приятно убедиться, что некоторые узы дружбы не разрываются расстоянием','Sería conveniente que las escuelas enseñaran inteligencia emocional desde edades tempranas para evitar problemas de conducta en el futuro-Было бы желательно, чтобы школы обучали эмоциональному интеллекту с ранних лет, чтобы избежать проблем с поведением в будущем','Cuando me ofrecieron el puesto, no lo dudé ni un instante porque era justo lo que había estado buscando-Когда мне предложили должность, я не колебался ни мгновения, потому что это было именно то, что я искал','No es que no confíe en tus capacidades, es que el margen de error es prácticamente nulo en este proyecto-Не то чтобы я не доверял твоим способностям, просто допустимая погрешность в этом проекте практически нулевая','Aunque la tecnología avanza a pasos agigantados, todavía hay muchas personas que carecen de acceso a internet en zonas rurales-Хотя технологии развиваются семимильными шагами, в сельских районах всё ещё много людей, у которых нет доступа к интернету','Bastaría con que cada día dedicaras treinta minutos a hacer ejercicio para notar cómo mejora tu salud-Было бы достаточно, если бы ты каждый день уделял тридцать минут физическим упражнениям, чтобы заметить, как улучшается твоё здоровье','Me horrorra pensar que aún exista la pena de muerte en pleno siglo veintiuno-Меня ужасает мысль, что в двадцать первом веке всё ещё существует смертная казнь','La semana pasada el ayuntamiento aprobó una ley que prohíbe fumar en las terrazas, pero la mayoría de los bares la han ignorado-На прошлой неделе мэрия приняла закон, запрещающий курить на террасах, но большинство баров его проигнорировали','Si tuviera que elegir un solo recuerdo de mi infancia, me quedaría con los veranos que pasaba en casa de mis abuelos en el pueblo-Если бы мне пришлось выбрать одно воспоминание из детства, я бы остановился на лете, которое я проводил в доме бабушки и дедушки в деревне','Por muy bien que te venga esa oportunidad, no deberías aceptarla si compromete tus principios éticos-Как бы хорошо тебе ни подходила эта возможность, тебе не следует её принимать, если она ставит под угрозу твои этические принципы','Es probable que para el próximo lustro hayan desaparecido muchos oficios artesanales debido a la automatización-Вероятно, к следующей пятилетке многие ремесленные профессии исчезнут из-за автоматизации','Me sorprende la indiferencia de la sociedad ante las noticias sobre refugiados que arriesgan su vida en el mar-Меня удивляет безразличие общества к новостям о беженцах, которые рискуют своей жизнью в море','A menudo me pregunto si realmente somos libres o simplemente nos han enseñado a creer que lo somos-Часто я задаюсь вопросом, действительно ли мы свободны, или нас просто научили верить, что это так','Cuando empecé a trabajar en este sector, jamás imaginé que llegaría a ver tantos cambios tecnológicos en tan poco tiempo-Когда я начал работать в этом секторе, я никогда не представлял, что увижу так много технологических изменений за такое короткое время','Se dice que el nuevo medicamento reduce los síntomas drásticamente, pero aún no hay estudios concluyentes que lo respalden-Говорят, что новое лекарство резко уменьшает симптомы, но пока нет убедительных исследований, подтверждающих это','No solo debes fijarte en el salario, sino también en las condiciones laborales y las oportunidades de crecimiento-Тебе нужно смотреть не только на зарплату, но и на условия труда и возможности для роста','El verdadero problema no es la falta de recursos, sino la mala gestión de los mismos por parte de quienes gobiernan-Настоящая проблема не в недостатке ресурсов, а в плохом управлении ими со стороны тех, кто правит','Con el paso del tiempo aprendí que guardar rencor solo perjudica a quien lo siente, así que decidí perdonar y soltar-Со временем я понял, что затаивать обиду вредит лишь тому, кто её испытывает, поэтому я решил простить и отпустить','Habría sido mucho mejor que dialogaran antes de tomar medidas drásticas que afectan a toda la comunidad-Было бы намного лучше, если бы они сначала обсудили, а потом принимали радикальные меры, затрагивающие всё сообщество','Me resulta insólito que los servicios de transporte público sean tan deficientes en una ciudad considerada moderna-Для меня необычно, что услуги общественного транспорта настолько плохи в городе, считающемся современным','Basta con observar cómo se comporta la gente en redes sociales para darse cuenta de la falta de empatía que reina-Достаточно понаблюдать, как люди ведут себя в социальных сетях, чтобы понять, какое царит отсутствие эмпатии','Aun siendo consciente de los riesgos, decidió invertir todos sus ahorros en ese negocio y por suerte le fue bien-Хотя он осознавал риски, он решил вложить все свои сбережения в этот бизнес, и, к счастью, у него всё получилось','La conferencia estaba siendo muy amena hasta que un asistente interrumpió con preguntas fuera de lugar-Конференция была очень интересной, пока один из участников не прервал её неуместными вопросами','Ojalá todos tuviéramos la valentía de defender nuestras ideas sin miedo a la crítica o al ridículo-Если бы у всех нас хватило смелости отстаивать свои идеи без страха перед критикой или насмешками','Espero que hayan aprendido la lección después del fracaso estrepitoso de su último proyecto empresarial-Надеюсь, они усвоили урок после сокрушительного провала своего последнего бизнес-проекта','Aunque la empresa patrocina eventos benéficos, no podemos olvidar los despidos masivos que llevaron a cabo el año pasado-Хотя компания спонсирует благотворительные мероприятия, мы не можем забыть о массовых увольнениях, которые они провели в прошлом году','Me alegra observar cómo las nuevas generaciones muestran una conciencia ecológica mucho más desarrollada que la nuestra-Мне приятно наблюдать, как новые поколения проявляют гораздо более развитое экологическое сознание, чем наше','Si mañana me tocara la lotería, lo primero sería donar una parte a organizaciones que luchan contra la pobreza infantil-Если бы завтра я выиграл в лотерею, первым делом я бы пожертвовал часть организациям, борющимся с детской бедностью','El periódico publicó una noticia sensacionalista para vender más ejemplares, luego tuvieron que rectificar-Газета опубликовала сенсационную новость, чтобы продать больше экземпляров, потом им пришлось её исправлять','No entiendo por qué te empeñas en justificar a quien claramente te ha faltado al respeto en varias ocasiones-Я не понимаю, почему ты настаиваешь на оправдании того, кто явно несколько раз проявлял к тебе неуважение','Tan pronto como el avión aterrizó, encendí el móvil para avisar a mi familia de que había llegado bien-Как только самолёт приземлился, я включил телефон, чтобы сообщить семье, что я благополучно прибыл','Se rumorea que los precios de la vivienda subirán otro veinte por ciento, y eso que ya están por las nubes-Ходят слухи, что цены на жильё поднимутся ещё на двадцать процентов, хотя они уже заоблачные', 'En mi opinión, deberías sopesar los pros y los contras antes de tomar una decisión tan importante-По моему мнению, тебе стоит взвесить все за и против, прежде чем принимать такое важное решение','Desde mi punto de vista, la clave del éxito está en la perseverancia más que en el talento innato-С моей точки зрения, ключ к успеху кроется в настойчивости больше, чем в врождённом таланте','Si no te importa que te dé un consejo, yo que tú no dejaría pasar esta oportunidad-Если не возражаешь против совета, я бы на твоём месте не упускал эту возможность','Estoy totalmente de acuerdo contigo en que la educación debería ser gratuita y accesible para todos-Я полностью согласен с тобой в том, что образование должно быть бесплатным и доступным для всех','No comparto tu opinión porque creo que hay otros factores que no estás teniendo en cuenta-Я не разделяю твоё мнение, потому что считаю, что есть другие факторы, которые ты не учитываешь','¿Podrías explicarme qué te lleva a pensar eso? Me gustaría entender tu razonamiento-Не мог бы ты объяснить, что заставляет тебя так думать? Мне хотелось бы понять твои рассуждения','Lo que intento decir es que no siempre podemos controlar las circunstancias, pero sí nuestra reacción ante ellas-То, что я пытаюсь сказать: мы не всегда можем контролировать обстоятельства, но можем контролировать свою реакцию на них','Me da la sensación de que estás pasando por alto un detalle muy importante que podría cambiar todo-У меня такое ощущение, что ты упускаешь из виду очень важную деталь, которая может всё изменить','Si hubiera estado en tu lugar, probablemente habría actuado de manera muy similar-Если бы я был на твоём месте, вероятно, поступил бы очень похоже','Dadas las circunstancias, creo que lo más sensato es esperar a tener más información antes de actuar-Учитывая обстоятельства, я считаю, что разумнее всего подождать, пока у нас будет больше информации, прежде чем действовать','No es tan sencillo como parece, hay muchos matices que debemos considerar-Это не так просто, как кажется, есть много нюансов, которые мы должны учесть','Eso que dices puede sonar bien en teoría, pero en la práctica resulta mucho más complicado-То, что ты говоришь, может звучать хорошо в теории, но на практике оказывается гораздо сложнее','Si te soy sincero, no termina de convencerme la propuesta que han presentado-Если честно, меня не совсем убеждает предложение, которое они представили','¿Podrías ponerme un ejemplo concreto de lo que acabas de decir para entenderlo mejor? Не мог бы ты привести конкретный пример только что сказанного, чтобы я лучше понял','Lo que realmente importa no es ganar o perder, sino lo que aprendemos en el proceso-На самом деле важно не выиграть или проиграть, а то, чему мы учимся в процессе','Me resulta frustrante cuando la gente no respeta los turnos de palabra en una conversación-Меня расстраивает, когда люди не уважают очерёдность высказываний в разговоре','Preferiría no opinar sobre ese tema porque no tengo suficiente información al respecto-Я предпочёл бы не высказываться на эту тему, потому что у меня недостаточно информации об этом','Es evidente que hemos cometido errores en el pasado, pero ahora estamos haciendo todo lo posible por remediarlos-Очевидно, что в прошлом мы совершали ошибки, но сейчас мы делаем всё возможное, чтобы их исправить','No me malinterpretes, no estoy criticando tu trabajo, solo sugiero algunas mejoras-Не пойми меня превратно, я не критикую твою работу, я лишь предлагаю некоторые улучшения','¿Qué opinas de la nueva normativa que acaba de aprobar el gobierno? Me gustaría conocer tu parecer-Что ты думаешь о новом законе, который только что приняло правительство? Мне хотелось бы узнать твоё мнение','Por desgracia, no siempre podemos elegir lo que nos pasa, pero sí cómo enfrentarlo-К сожалению, мы не всегда можем выбирать то, что с нами происходит, но можем выбирать, как с этим справляться','Te aseguro que merece la pena hacer el esfuerzo, aunque al principio cueste-Уверяю тебя, стоит приложить усилия, даже если сначала трудно','No soporto cuando la gente interrumpe a los demás sin dejarles terminar de expresarse-Не выношу, когда люди перебивают других, не давая им закончить выражать свои мысли','Si pudiera cambiar una cosa del pasado, no sería nada, porque todo me ha hecho quien soy hoy-Если бы я мог изменить одну вещь в прошлом, я бы ничего не менял, потому что всё сделало меня тем, кто я есть','A veces es mejor callarse y observar que hablar sin tener toda la información-Иногда лучше промолчать и понаблюдать, чем говорить, не имея всей информации','Estaría encantado de ayudarte con la mudanza siempre que me avises con antelación-Я буду рад помочь тебе с переездом при условии, что предупредишь заранее','No es que no quiera ir a tu fiesta, es que ya tengo un compromiso ineludible esa noche-Не то чтобы я не хочу пойти на твою вечеринку, просто у меня уже есть неотложное дело в тот вечер','Llevo días dándole vueltas al asunto y creo que he llegado a una conclusión razonable-Я уже несколько дней обдумываю этот вопрос и, кажется, пришёл к разумному выводу','¿Consideras que es ético hacer negocios con empresas que contaminan el medio ambiente? Ты считаешь этичным вести бизнес с компаниями, которые загрязняют окружающую среду?','Me alegra profundamente que hayas decidido retomar tus estudios, nunca es tarde para aprender-Я очень рад, что ты решил возобновить учёбу, никогда не поздно учиться','Deberíamos centrarnos en encontrar soluciones en lugar de perder el tiempo echándonos la culpa unos a otros-Нам следует сосредоточиться на поиске решений, вместо того чтобы тратить время на взаимные обвинения','Espero que esta vez hayas aprendido la lección y no vuelvas a cometer el mismo error-Надеюсь, на этот раз ты усвоил урок и не повторишь ту же ошибку','Si realmente te importa la amistad, deberías hacer un esfuerzo por comprender su punto de vista-Если тебе действительно важна дружба, тебе стоит приложить усилия, чтобы понять его точку зрения','No soy quién para juzgar tus decisiones, pero permíteme que te ofrezca mi humilde opinión-Я не тот, кто судит твои решения, но позволь мне предложить моё скромное мнение','¿Hasta qué punto crees que la tecnología está afectando a nuestra capacidad de concentración? Как ты думаешь, до какой степени технологии влияют на нашу способность концентрироваться?','Me parece una falta de respeto que llegues tarde sin avisar cuando quedamos para algo importante-Я считаю неуважением, когда ты опаздываешь без предупреждения, если мы встречаемся для чего-то важного','A largo plazo, invertir en formación siempre resulta rentable, aunque ahora no lo parezca-В долгосрочной перспективе инвестиции в образование всегда окупаются, даже если сейчас это так не кажется','Si tuviera que definirme con tres palabras, diría que soy perseverante, curiosa y optimista-Если бы мне нужно было охарактеризовать себя тремя словами, я бы сказал, что я настойчивый, любознательный и оптимистичный','Como bien dices, hay excepciones a toda regla, pero no podemos basar nuestra conducta en casos puntuales-Как ты верно говоришь, из любого правила есть исключения, но мы не можем основывать своё поведение на единичных случаях','Celebro que por fin hayas encontrado un trabajo que te llena y donde te valoran-Я рад, что ты наконец нашёл работу, которая тебя наполняет и где тебя ценят','No entiendo cómo puedes defender a alguien que te ha mentido reiteradamente-Я не понимаю, как ты можешь защищать того, кто тебе многократно лгал','El principal obstáculo que veo es la falta de comunicación entre los departamentos implicados-Основное препятствие, которое я вижу, — это отсутствие коммуникации между вовлечёнными отделами', 'Te agradecería que me prestaras atención cuando te hablo, porque es la tercera vez que repito lo mismo-Я был бы благодарен, если бы ты обращал на меня внимание, когда я говорю, потому что я повторяю одно и то же уже в третий раз','A mi juicio, estamos ante un problema de fondo que requiere una solución estructural, no parches temporales-По моему мнению, мы имеем дело с глубинной проблемой, требующей структурного решения, а не временных заплаток','Cuando acabes con tus tareas, podemos revisar juntos el informe y ver qué puntos podemos mejorar-Когда закончишь со своими задачами, мы можем вместе просмотреть отчёт и посмотреть, какие моменты можно улучшить','Siento haberte molestado tan tarde, pero era urgente y no sabía a quién más recurrir-Извини, что побеспокоил так поздно, но это было срочно, и я не знал, к кому ещё обратиться','Seamos realistas: por mucho que nos esforcemos, no podremos complacer a todo el mundo-Будем реалистами: как бы мы ни старались, мы не сможем угодить всем','No deberías dar por sentado que siempre voy a estar ahí para solucionarte los problemas-Тебе не следует воспринимать как должное, что я всегда буду рядом, чтобы решать твои проблемы','La clave está en no rendirse después del primer fracaso, sino aprender de él y seguir adelante сон más fuerza-Ключ в том, чтобы не сдаваться после первой неудачи, а учиться на ней и идти дальше с ещё большей силой','¿No crees que sería más productivo colaborar en lugar de competir constantemente entre nosotros? Не думаешь, что было бы продуктивнее сотрудничать, а не постоянно конкурировать друг с другом?','Por experiencia propia, te digo que los cambios radicales casi nunca funcionan; es mejor ir paso a paso-По собственному опыту скажу, что радикальные изменения почти никогда не работают; лучше идти шаг за шагом','Me da rabia reconocerlo, pero tenías razón y yo estaba equivocada con respecto a ese asunto-Меня злит это признавать, но ты был прав, а я ошибался насчёт этого дела','Es preferible que organicemos la reunión con antelación para que todos puedan asistir sin problemas-Предпочтительнее организовать встречу заранее, чтобы все могли без проблем присутствовать','Estoy hasta la coronilla de que siempre pospongas las decisiones importantes por miedo a equivocarte-Я сыт по горло тем, что ты всегда откладываешь важные решения из страха ошибиться','Si realmente valoras nuestra amistad, deberías hablarme con sinceridad en lugar de evitar el tema-Если ты действительно ценишь нашу дружбу, тебе следует говорить со мной искренне, вместо того чтобы избегать темы','Parece que no terminas de comprender la magnitud del problema, así que te lo explicaré con manzanas-Кажется, ты не до конца понимаешь масштаб проблемы, поэтому я объясню тебе на пальцах','No es mi intención ofenderte, pero creo que alguien tenía que decirte lo que pienso de verdad-Не в моих намерениях обидеть тебя, но я считаю, что кто-то должен был сказать тебе, что я на самом деле думаю','¿Hasta cuándo vamos a seguir permitiendo que unas pocas personas acumulen riqueza mientras la mayoría lucha por sobrevivir? Доколе мы будем продолжать позволять немногим людям накапливать богатство, в то время как большинство борется за выживание?','Si pudiera retroceder el tiempo, no cambiaría mis errores, porque gracias a ellos maduré-Если бы я мог повернуть время вспять, я бы не стал менять свои ошибки, потому что благодаря им я повзрослел','No te precipites juzgando sin conocer todos los detalles, que a menudo las apariencias engañan-Не торопись судить, не зная всех деталей, потому что часто внешность обманчива','Estoy segura de que si perseveras, terminarás alcanzando tus metas, por muy lejanas que parezcan ahora-Я уверена, что если ты будешь настойчивым, то в итоге достигнешь своих целей, какими бы далёкими они ни казались сейчас','¿Podrías concretar un poco más tu propuesta? Así como la planteas, resulta demasiado ambigua y poco realista-Не мог бы ты немного конкретизировать своё предложение? В том виде, в каком ты его излагаешь, оно слишком расплывчато и малореалистично','Lo siento mucho por ti, pero no voy a cargar con las consecuencias de tus malas decisiones-Мне очень жаль тебя, но я не собираюсь нести на себе последствия твоих плохих решений','A la larga, la honestidad siempre compensa, aunque al principio parezca que no-В долгосрочной перспективе честность всегда окупается, даже если сначала кажется, что нет','No te obsesiones con lo que piensen los demás, porque nunca lloverá a gusto de todos-Не зацикливайся на том, что думают другие, потому что никогда не угодишь всем','Dado que las circunstancias han cambiado, creo que deberíamos revisar el plan inicial y ajustarlo-Поскольку обстоятельства изменились, думаю, нам следует пересмотреть первоначальный план и скорректировать его','Me da mucha pena verte tan desanimado porque sé que eres capaz de lograr cosas increíbles-Мне очень жаль видеть тебя таким удручённым, потому что я знаю, что ты способен на невероятные вещи','Reconozco que al principio no confiaba en tu criterio, pero con el tiempo me has demostrado que estabas en lo cierto-Признаю, что сначала я не доверял твоему суждению, но со временем ты доказал мне, что был прав','Es crucial que establezcamos prioridades claras antes de embarcarnos en nuevos proyectos-Крайне важно установить чёткие приоритеты, прежде чем браться за новые проекты','¿Por qué no dejamos las diferencias a un lado y buscamos un punto de encuentro que nos beneficie a todos? Почему бы нам не оставить разногласия в стороне и не найти точку соприкосновения, которая принесёт пользу всем нам?','Aunque no lo creas, el simple hecho de escuchar activamente a los demás puede mejorar muchísimo la comunicación-Хотя ты не поверишь, но простое активное слушание других может значительно улучшить общение','Me alegra que hayas tomado la iniciativa de pedir ayuda, porque de verdad era necesario-Я рад, что ты проявил инициативу и попросил помощи, потому что это действительно было необходимо','No concibo la vida sin viajar de vez en cuando, porque me ayuda a desconectar y a ganar perspectiva-Я не представляю жизни без периодических путешествий, потому что они помогают мне отключаться и обретать перспективу','¿Hasta qué punto somos responsables de nuestro propio bienestar emocional, y en qué medida influye el entorno? В какой степени мы сами отвечаем за своё эмоциональное благополучие и в какой мере на него влияет окружение?','A mi parecer, la solución pasa por dialogar con todas las partes implicadas y llegar a un consenso-По-моему, решение заключается в том, чтобы провести диалог со всеми заинтересованными сторонами и достичь консенсуса','No me explico cómo una persona tan preparada puede cometer errores tan elementales-Я не понимаю, как такой подготовленный человек может совершать такие элементарные ошибки','Si pudiera darte un consejo, te diría que no mezcles los sentimientos con los negocios, porque suele salir mal-Если бы я мог дать тебе совет, я бы сказал: не смешивай чувства с бизнесом, потому что обычно это плохо кончается','Vale más la pena intentarlo y fracasar que quedarse cruzado de brazos con la duda de qué pudo haber sido-Лучше попробовать и потерпеть неудачу, чем сидеть сложа руки с сомнениями о том, что могло бы быть','Hace falta más conciencia social y menos individualismo para construir una sociedad más justa-Нужно больше социальной сознательности и меньше индивидуализма, чтобы построить более справедливое общество','No soporto que me den largas cuando necesito una respuesta urgente y clara-Не выношу, когда мне дают уклончивые ответы, когда мне нужен срочный и чёткий ответ','Te confieso que al principio me costó adaptarme a la nueva situación, pero ahora la veo con otros ojos-Признаюсь тебе, сначала мне было трудно приспособиться к новой ситуации, но теперь я смотрю на неё другими глазами','Estaría bien que, en lugar de criticar destructivamente, aportaras soluciones constructivas-Было бы хорошо, если бы вместо деструктивной критики ты предлагал конструктивные решения','A medida que maduro, voy entendiendo que la paciencia es una de las virtudes más necesarias-По мере того как я взрослею, я начинаю понимать, что терпение — одна из самых необходимых добродетелей','No entiendo a la gente que se queja constantemente pero no hace nada por cambiar su situación-Я не понимаю людей, которые постоянно жалуются, но ничего не делают, чтобы изменить свою ситуацию','Si de verdad valoras tu salud mental, deberías aprender a poner límites y a decir que no cuando sea necesario-Если ты действительно ценишь своё психическое здоровье, тебе стоит научиться устанавливать границы и говорить нет, когда это необходимо','Me he dado cuenta de que compararme con los demás solo me genera frustración, así que he decidido centrarme en mi propio progreso-Я понял, что сравнение с другими только вызывает у меня разочарование, поэтому я решил сосредоточиться на своём собственном прогрессе','¿Crees que la sociedad actual está más informada o más desinformada debido a la sobreabundancia de contenido? Ты считаешь, что современное общество стало более информированным или более дезинформированным из-за перенасыщения контентом', 'Desde que empecé a meditar, mi nivel de estrés ha disminuido notablemente-С тех пор как я начал медитировать, мой уровень стресса заметно снизился','No me importa reconocer que necesito ayuda, porque sé que nadie es autosuficiente-Мне не стыдно признать, что мне нужна помощь, потому что я знаю, что никто не самодостаточен','¿Podrías concretar qué es exactamente lo que esperas de mí en este proyecto? Мог бы ты конкретно сказать, что именно ты ожидаешь от меня в этом проекте?','Es preferible retrasar la entrega a entregar un producto mediocre que no cumpla los requisitos-Лучше задержать сдачу, чем сдать посредственный продукт, не соответствующий требованиям','Si te soy franco, creo que estás siendo demasiado optimista con los plazos previstos-Если быть с тобой откровенным, я думаю, ты слишком оптимистично смотришь на намеченные сроки','Acabo de caer en la cuenta de que llevaba horas mirando el móvil sin hacer nada productivo-Я только что осознал, что уже несколько часов смотрел в телефон, не делая ничего продуктивного','¿No te parece que gastamos demasiado tiempo en reuniones que podrían resolverse con un simple correo? Тебе не кажется, что мы тратим слишком много времени на встречи, которые можно было бы решить простым письмом?','Todo el mundo comete errores, pero lo importante es asumir las consecuencias sin excusas-Все совершают ошибки, но важно принимать последствия без оправданий','Me comprometo a tenerte informado de cada avance, para que no te sientas fuera del proyecto-Обязуюсь держать тебя в курсе каждого продвижения, чтобы ты не чувствовал себя вне проекта','Llevo una temporada en la que me cuesta horrores concentrarme, no sé si será el cansancio acumulado-В последнее время мне ужасно трудно концентрироваться, не знаю, может быть, это накопившаяся усталость','Te invito a que te unas a la iniciativa de recogida de residuos del parque este sábado-Я приглашаю тебя присоединиться к инициативе по уборке мусора в парке в эту субботу','No vale la pena desgastarse discutiendo con gente que no está dispuesta a escuchar-Не стоит изматывать себя спорами с людьми, которые не расположены слушать','Si hubiera tenido tu experiencia, probablemente habría tomado la misma decisión que tú-Если бы у меня был твой опыт, я бы, вероятно, принял такое же решение, как и ты','¿Te parece apropiado que interrumpas la clase cada dos minutos para hacer preguntas sin relevancia? Ты считаешь уместным прерывать занятие каждые две минуты, чтобы задавать неуместные вопросы?','Poco a poco voy notando cómo mi actitud positiva influye en el ambiente de trabajo-Мало-помалу я замечаю, как моё позитивное отношение влияет на рабочую атмосферу','Sé que la situación es complicada, pero no vamos a solucionarla lamentándonos todo el día-Я знаю, что ситуация сложная, но мы не решим её, жалуясь весь день','Con el objetivo de mejorar la comunicación, he propuesto establecer una reunión semanal de seguimiento-С целью улучшения коммуникации я предложил установить еженедельную встречу для контроля','A menudo subestimamos el poder de un simple gracias para fortalecer las relaciones humanas-Мы часто недооцениваем силу простого спасибо для укрепления человеческих отношений','No entiendo cómo puedes ser tan permisivo con comportamientos que claramente son inaceptables-Я не понимаю, как ты можешь быть таким снисходительным к поведению, которое явно неприемлемо','Espero que no te moleste que te dé mi opinión sin que me la pidas, pero creo que debes saberlo-Надеюсь, ты не обидишься, что я выскажу своё мнение, хотя ты его не просил, но я считаю, что ты должен это знать','Si me presionáis tanto, lo único que conseguiréis es que me bloquee y no rinda adecuadamente-Если вы будете так сильно на меня давить, единственное, чего вы добьётесь, — это что я заблокируюсь и не буду работать должным образом','El problema no es que haya desacuerdo, sino que no sabemos gestionarlo sin que termine en confrontación-Проблема не в том, что есть разногласие, а в том, что мы не умеем управлять им, чтобы оно не заканчивалось конфронтацией','Para serte sincera, no me gusta cómo me trató en la reunión, me senti faltada al respeto-Если честно, мне не понравилось, как он со мной обошёлся на встрече, я почувствовала неуважение','¿Alguna vez te has planteado que quizá el problema no son los demás, sino tu forma de reaccionar? Ты когда-нибудь задумывался, что, возможно, проблема не в других, а в твоём способе реагировать?','La experiencia me ha enseñado que no se puede confiar a la ligera en las promesas de un desconocido-Опыт научил меня, что нельзя легкомысленно доверять обещаниям незнакомца','Me resulta alentador ver cómo la gente se vuelca ayudando a los damnificados por la catástrofe-Мне отрадно видеть, как люди активно помогают пострадавшим от катастрофы','No entiendo a los que defienden la tauromaquia, me parece una práctica cruel y desfasada-Я не понимаю тех, кто защищает бой быков, мне это кажется жестокой и устаревшей практикой','Para el próximo trimestre, nos hemos propuesto reducir la rotación de personal mejorando el clima laboral-На следующий квартал мы поставили себе цель сократить текучку кадров, улучшив климат на работе','¿Podrías hablarme con más calma? Te noto muy alterado y no consigo seguir tu explicación-Не мог бы ты говорить со мной спокойнее? Я вижу, что ты очень взволнован, и не могу уследить за твоими объяснениями','Hay veces en las que el silencio es la respuesta más elegante que puedes dar-Иногда молчание — это самый элегантный ответ, который ты можешь дать','No soy partidario de las etiquetas, pero reconocer que los estereotipos limitan nuestra percepción-Я не сторонник ярлыков, но признаю, что стереотипы ограничивают наше восприятие','¿No crees que sería más inteligente delegar algunas de tus responsabilidades en lugar de pretender abarcarlo todo? Не думаешь, что было бы умнее делегировать некоторые из твоих обязанностей, вместо того чтобы пытаться объять необъятное?','Estoy atravesando una etapa de muchos cambios, y aunque me da miedo, también me ilusiona-Я переживаю этап больших перемен, и хотя мне страшно, меня это также радует','Me da pena que hayas tenido que pasar por eso solo, la próxima vez cuenta conmigo-Мне жаль, что тебе пришлось пережить это одному, в следующий раз рассчитывай на меня','Si no te queda claro algún concepto, no dudes en preguntar, prefiero que preguntes a que luego arrastres dudas-Если тебе что-то не ясно, не стесняйся спрашивать, я предпочитаю, чтобы ты спрашивал, чем потом тащил за собой сомнения','Mantener una rutina de ejercicio me ha ayudado a canalizar la ansiedad y dormir mejor-Поддержание режима упражнений помогло мне направить тревогу в русло и лучше спать','¿Hasta qué punto crees que los medios de comunicación manipulan la opinión pública sin que nos demos cuenta? Как ты думаешь, в какой степени средства массовой информации манипулируют общественным мнением, не осознавая этого?','Si me dieran a elegir entre la fama y la tranquilidad, sin dudarlo escogería lo segundo-Если бы мне дали выбор между славой и спокойствием, я бы без колебаний выбрал второе','Con el paso de los meses, he aprendido a relativizar los problemas y a no darle tanta importancia a lo que no la tiene-С течением месяцев я научился относиться к проблемам более легко и не придавать большого значения тому, что его не имеет','Personalmente, creo que la clave está en educar desde la infancia en valores como el respeto y la tolerancia-Лично я считаю, что ключ в том, чтобы с детства воспитывать такие ценности, как уважение и терпимость','No soporto la música a volumen alto en espacios cerrados, me produce una sensación de agobio terrible-Не выношу громкую музыку в закрытых помещениях, это вызывает у меня ужасное чувство подавленности','Me alegra comprobar que, a pesar de los pesares, sigues manteniendo la ilusión por aprender cosas nuevas-Я рад убедиться, что, несмотря на невзгоды, ты продолжаешь сохранять энтузиазм к изучению нового','¿Alguna vez te has sentido juzgado sin que te dieran la oportunidad de explicarte? A mí me ha pasado mucho-Ты когда-нибудь чувствовал, что тебя осуждают, не давая возможности объясниться? Со мной такое часто случалось','Estoy convencido de que el talento individual es importante, pero sin trabajo en equipo no se llega lejos-Я убеждён, что индивидуальный талант важен, но без командной работы далеко не уедешь','No me metas en tus líos con el jefe, yo no tengo nada que ver con ese asunto-Не впутывай меня в свои разборки с начальником, я не имею никакого отношения к этому делу','Si pudiera pedir un deseo, no sería riqueza material, sino salud y tiempo para compartir con los míos-Если бы я мог загадать желание, это было бы не материальное богатство, а здоровье и время, чтобы разделить его с близкими','Os propongo que entre todos financiemos un regalo para María, que se jubila esta semana-Я предлагаю, чтобы мы все вместе собрали деньги на подарок Марии, которая на этой неделе выходит на пенсию','Me da igual lo que opine tu familia, la decisión de vivir juntos es solo nuestra y nadie debe entrometerse-Мне всё равно, что думает твоя семья, решение жить вместе только наше, и никто не должен вмешиваться','Después de tantos desengaños, he decidido centrarme en mi crecimiento personal antes que en buscar pareja-После стольких разочарований я решил сосредоточиться на личностном росте, прежде чем искать партнёра','Con toda la lluvia que ha caído, no me extraña que el río se haya desbordado en varias zonas-При всём том количестве дождя, который выпал, неудивительно, что река вышла из берегов в нескольких местах','¿No sería más sencillo que usaramos una herramienta colaborativa en lugar de enviarnos cien correos al día? Было бы не проще использовать совместный инструмент, вместо того чтобы посылать друг другу сотню писем в день?', 'Para ser sincero, no me acaba de convencer la propuesta que has presentado esta mañana-Если честно, меня не совсем убеждает предложение, которое ты представил сегодня утром','Siempre que surge un imprevisto, él es el primero en echar balones fuera en lugar de buscar soluciones-Когда возникает непредвиденная ситуация, он первым начинает уходить от ответственности вместо поиска решений','Quizás deberíamos haber consultado a un especialista antes de tomar esta decisión tan arriesgada-Возможно, нам следовало проконсультироваться со специалистом, прежде чем принимать это рискованное решение','No te imaginas lo mucho que agradezco que hayas estado a mi lado durante estos meses tan difíciles-Ты не представляешь, как я благодарен, что ты был рядом со мной в эти трудные месяцы','Cuando terminemos este proyecto, lo primero que haré será dormir doce horas seguidas sin despertador-Когда мы закончим этот проект, первое, что я сделаю, — это просплю двенадцать часов подряд без будильника','Me parece lamentable que tengamos que estar discutiendo algo tan básico como el respeto a los demás-Мне кажется прискорбным, что мы должны обсуждать такую базовую вещь, как уважение к другим','Si pudiera vivir en cualquier parte del mundo, elegiría un pueblecito perdido en la costa de Portugal-Если бы я мог жить в любой точке мира, я бы выбрал затерянную деревушку на побережье Португалии','El éxito de la operación depende casi por completo de la coordinación entre los distintos equipos-Успех операции почти полностью зависит от координации между разными командами','No vayas a creer que te lo digo de mal rollo, solo trato de ayudarte a mejorar-Не думай, что я говорю тебе это со зла, я просто пытаюсь помочь тебе стать лучше','Al final resulta que el problema no era tan grave como parecía, solo faltaba comunicación-В итоге оказывается, что проблема не была такой серьёзной, как казалась, просто не хватало общения','A fuerza de repetir los mismos errores, he aprendido a identificar mis puntos débiles y a trabajar en ellos-Благодаря повторению одних и тех же ошибок я научился выявлять свои слабые места и работать над ними','¿Podrías dejar de interrumpirme cada dos por tres y dejarme terminar de explicar mi punto de vista? Не мог бы ты перестать перебивать меня каждые две минуты и дать мне закончить объяснять мою точку зрения?','No sé tú, pero yo prefiero la calidad a la cantidad, aunque eso implique pagar un poco más-Не знаю, как ты, но я предпочитаю качество количеству, даже если это означает заплатить немного больше','Hay quien nace con un don para la música, y quien tiene que sudar tinta para tocar cuatro acordes-Есть те, кто рождается с даром к музыке, и те, кому приходится попотеть, чтобы сыграть четыре аккорда','La empresa nos ha prometido que mejorarían las condiciones laborales, pero aún estamos esperando los cambios-Компания обещала нам, что улучшит условия труда, но мы всё ещё ждём изменений','Ahora que lo pienso, quizá fui demasiado duro con mis críticas y debería disculparme-Теперь, когда я думаю об этом, возможно, я был слишком резок в своей критике и должен извиниться','Estoy hasta el moño de los bulos que circulan por las redes sociales, la gente se cree cualquier cosa-Меня достали фейки, которые распространяются в социальных сетях, люди верят во что угодно','Si te sirve de consuelo, a mí también me pasó algo parecido cuando empecé en esto-Если тебя это утешит, со мной случилось нечто подобное, когда я начинал в этом деле','El quid de la cuestión no es quién tiene la culpa, sino cómo podemos solucionarlo entre todos-Суть вопроса не в том, кто виноват, а в том, как мы можем решить это все вместе','Me niego a participar en una discusión en la que nadie escucha y solo pretenden imponer su opinión-Я отказываюсь участвовать в дискуссии, в которой никто не слушает и все только пытаются навязать своё мнение','Poco a poco la tecnología está cambiando nuestra forma de relacionarnos, no sé si para bien o para mal-Мало-помалу технологии меняют наш способ общения, не знаю, к лучшему или к худшему','Te juro que si me hubieras avisado con cinco minutos de antelación, habría llegado a la hora pactada-Клянусь, если бы ты предупредил меня на пять минут раньше, я бы пришёл в условленное время','Un buen líder no solo da órdenes, sino que también sabe escuchar y motivar a su equipo-Хороший лидер не только отдаёт приказы, но также умеет слушать и мотивировать свою команду','La verdad es que me da pereza organizar la mudanza, pero me haría ilusión estrenar piso nuevo-Честно говоря, мне лень организовывать переезд, но мне было бы приятно въехать в новую квартиру','Suele pasar que cuando má -экстрадиция','extralimitación-превышение полномочий','extranjería-иностранное подданство','extrapolación-экстраполяция','fabricación-производство','facción-фракция', 'A no ser que medies tú, no creo que lleguemos a un acuerdo con ellos-Если только ты не выступишь посредником, я не думаю, что мы достигнем с ними соглашения','Con tal de que me devuelvas el dinero antes de junio, te presto lo que necesites-При условии, что вернёшь деньги до июня, я одолжу тебе что нужно','Fuera quien fuese el responsable, debería haber asumido las consecuencias de sus actos-Кем бы ни был ответственный, он должен был принять последствия своих поступков','Por muy bien que te haya ido hasta ahora, no puedes confiarte porque la competencia es feroz-Как бы хорошо тебе ни шло до сих пор, ты не можешь расслабляться, потому что конкуренция жестока','Cuando se trata de política, prefiere mantener una posición ambigua para no ofender a nadie-Когда дело доходит до политики, она предпочитает сохранять двусмысленную позицию, чтобы никого не обидеть','De haber sabido que el examen sería tan exhaustivo, me habría preparado de otra manera-Если бы я знал, что экзамен будет таким всеобъемлющим, я бы готовился по-другому','El simple hecho de que haya discrepancias no debería paralizar el proyecto, sino enriquecerlo-Сам факт наличия разногласий не должен парализовать проект, а обогащать его','A juzgar por su actitud tan evasiva, es probable que esté ocultando información relevante-Судя по его уклончивому поведению, вероятно, он скрывает важную информацию','Fuese cual fuese el resultado, estaba decidido a aceptarlo con entereza y aprender de la experiencia-Каким бы ни был результат, он был полон решимости принять его стойко и извлечь урок из опыта','Nada más llegar al poder, el nuevo gobierno implementó medidas drásticas para reducir el déficit fiscal-Как только пришёл к власти, новое правительство приняло решительные меры для сокращения бюджетного дефицита','Por más que intento convencerle de que esta estrategia es viable, se muestra reacio a cambiar de opinión-Как я ни пытаюсь убедить его, что эта стратегия жизнеспособна, он не желает менять мнение','En caso de que se produzca un imprevisto, hemos diseñado un plan de contingencia que cubre todas las eventualidades-В случае возникновения непредвиденных обстоятельств мы разработали план действий на случай непредвиденных обстоятельств, охватывающий все возможные ситуации','No solo es necesario que inviertas más tiempo, sino que también modifiques tu método de estudio-Недостаточно просто вкладывать больше времени, нужно также изменить свой метод обучения','Conforme avanzaba la crisis, se hizo evidente que las instituciones no estaban preparadas para gestionarla-По мере развития кризиса становилось очевидно, что институты не были готовы им управлять','Dado que la situación es tan volátil, sería imprudente tomar decisiones a largo plazo en este momento-Учитывая, что ситуация очень нестабильна, было бы неосмотрительно принимать долгосрочные решения в данный момент','Pese a que el informe oficial minimiza los daños, las imágenes filtradas muestran una catástrofe de enormes proporciones-Хотя официальный отчёт преуменьшает ущерб, просочившиеся изображения показывают катастрофу огромного масштаба','Una vez finalizado el plazo de inscripción, no se admitirán reclamaciones bajo ningún concepto-После окончания срока регистрации претензии не принимаются ни при каких обстоятельствах','Resulta paradójico que quienes más critican el sistema sean los mismos que menos hacen por cambiarlo-Это парадоксально, что те, кто больше всего критикует систему, меньше всего делают для её изменения','No deberías infravalorar el poder de persuasión que tiene un argumento bien estructurado y respaldado con datos-Тебе не следует недооценивать силу убеждения хорошо структуrado аргумента, подкреплённого данными','Tan pronto como el comité dictamine, procederemos a ejecutar la nueva normativa sin dilación-Как только комитет вынесет решение, мы незамедлительно приступим к выполнению нового регламента','A fin de evitar malentendidos, sería conveniente que redactaras un contrato donde se especifiquen todas las cláusulas-Во избежание недоразумений было бы желательно, чтобы ты составил договор, в котором будут указаны все пункты','Por injusto que parezca, en este país los plazos administrativos suelen incumplirse sin que haya consecuencias-Как бы несправедливо это ни казалось, в этой стране административные сроки часто нарушаются без последствий','Con independencia de lo que opine la mayoría, él defenderá su postura hasta las últimas consecuencias-Независимо от того, что думает большинство, он будет отстаивать свою позицию до конца','Llevo días dándole vueltas a la propuesta y cada vez me convenzo más de que es inviable-Я уже несколько дней обдумываю это предложение и всё больше убеждаюсь, что оно нежизнеспособно','Ni que decir tiene que si hubiera participado en la reunión, no habría permitido que tomaran esa decisión tan precipitada-Само собой разумеется, если бы я участвовал во встрече, я бы не позволил принять это столь поспешное решение','Sean cuales sean las circunstancias, no está justificado que trates a tus empleados con tan poca consideración-Какими бы ни были обстоятельства, не оправдано, что ты так мало считаешься со своими сотрудниками','Siempre y cuando se respeten los límites éticos, la experimentación con animales podría aportar avances médicos significativos-При условии, что соблюдаются этические границы, эксперименты на животных могут принести значительные медицинские успехи','Pero es que además de llegar tarde, ni siquiera te molestaste en disculparte por las molestias ocasionadas-Но, кроме того, что ты опоздал, ты даже не удосужился извиниться за доставленные неудобства','Tal y como está el mercado laboral, no me parece sensato renunciar sin tener otra oferta en firme-При таком состоянии рынка труда мне не кажется разумным увольняться, не имея другого твёрдого предложения','A decir verdad, su discurso resultó tan vacío de contenido que no aportó ninguna solución concreta a los problemas planteados-Честно говоря, его выступление оказалось настолько пустым по содержанию, что не предложило никакого конкретного решения поднятых проблем','No me cabe la menor duda de que si hubieras estado presente, habrías detectado la incongruencia de sus argumentos-У меня нет ни малейших сомнений, что если бы ты присутствовал, то заметил бы несостоятельность его аргументов','Cabe destacar que, pese a la gravedad de los hechos, la empresa ha eludido cualquier tipo de responsabilidad penal-Следует отметить, что, несмотря на серьёзность событий, компания избежала любой уголовной ответственности','Para que te hagas una idea, el margen de beneficio apenas alcanza para cubrir los gastos de producción-Чтобы ты понял, размер прибыли едва покрывает производственные расходы','La magnitud del problema exige que se tomen medidas estructurales, no meros parches que alivien los síntomas de forma temporal-Масштаб проблемы требует структурных мер, а не просто заплаток, которые временно облегчают симптомы','Por muy complejo que sea el asunto, deberías explicármelo con claridad, sin recurrir a tecnicismos innecesarios-Какой бы сложной ни была тема, тебе следует объяснить её мне ясно, не прибегая к ненужным техническим терминам','No es que me oponga a tu propuesta de manera frontal, simplemente creo que requiere un análisis más profundo-Я не то чтобы полностью против твоего предложения, я просто считаю, что оно требует более глубокого анализа','Visto lo visto, parece que vamos a tener que replantearnos la estrategia si queremos salir airosos de esta situación-Судя по всему, придётся пересмотреть стратегию, если мы хотим выйти с честью из этой ситуации','A poco que te esfuerces, notarás una mejora considerable en tu nivel de comprensión auditiva en cuestión de semanas-Стоит тебе немного приложить усилий, и ты заметишь значительное улучшение уровня понимания на слух всего за несколько недель','El quid de la cuestión reside en que no podemos seguir postergando las decisiones difíciles sin asumir las consecuencias a largo plazo-Суть вопроса в том, что мы не можем продолжать откладывать трудные решения без учёта долгосрочных последствий','Puestos a elegir, prefiero mil veces la transparencia incómoda a la opacidad que genera falsas expectativas-Если уж выбирать, я тысячу раз предпочту неудобную прозрачность, а не непрозрачность, порождающую ложные ожидания','Desde que se instauró el teletrabajo, hemos observado un incremento significativo de la productividad en ciertos departamentos-С момента введения удалённой работы мы наблюдаем значительный рост производительности в некоторых отделах','Me temo que no va a quedar más remedio que recurrir a la vía judicial para resolver este conflicto de intereses-Боюсь, что не останется ничего другого, кроме как обратиться в суд для разрешения этого конфликта интересов','No obstante, sería injusto atribuir todo el mérito a un solo individuo cuando ha sido un esfuerzo colectivo-Тем не менее, было бы несправедливо приписывать всю заслугу одному человеку, когда это было коллективное усилие','Se avecinan tiempos difíciles, así que más vale que vayamos haciendo acopio de recursos y planificando con prudencia-Грядут трудные времена, так что лучше запасаться ресурсами и планировать с осторожностью','Baste decir que, tras el escándalo, su credibilidad quedó tan deteriorada que nadie volvió a tomar en serio sus declaraciones-Достаточно сказать, что после скандала его репутация была настолько подорвана, что никто больше не воспринимал его заявления всерьёз','Cuanto antes asumas que el fracaso forma parte del camino hacia el éxito, antes dejarás de tener miedo a arriesgarte-Чем раньше ты примешь, что неудача — часть пути к успеху, тем раньше перестанешь бояться рисковать','No me importa reconocer que, en este asunto, tu criterio es más acertado que el mío, y por eso seguiré tu consejo-Мне не стыдно признать, что в этом вопросе твоё суждение более верное, чем моё, и поэтому я последую твоему совету','A pesar de lo mucho que nos esforzamos, los resultados no han sido los esperados, lo que indica que debemos cambiar el enfoque-Несмотря на все наши усилия, результаты оказались не такими, как ожидалось, что указывает на необходимость изменить подход','En lugar de perder el tiempo en debates estériles, propongo que canalicemos nuestras energías hacia acciones concretas y medibles-Вместо того чтобы тратить время на бесплодные дебаты, я предлагаю направить нашу энергию на конкретные и измеримые действия','Podría haberme equivocado al confiar en sus promesas, pero prefiero haberlo intentado a quedarme con la duda de no haberlo hecho-Я мог ошибиться, доверившись его обещаниям, но я предпочёл попробовать, чем остаться с сомнением, что не попробовал', 'En caso de que se repita esta situación, adoptaremos medidas correctivas de manera inmediata-В случае повторения данной ситуации мы незамедлительно примем корректирующие меры','A menos que los implicados lleguen a un consenso, el proyecto quedará suspendido sine die-Если только заинтересованные стороны не достигнут консенсуса, проект будет приостановлен на неопределённый срок','Siempre que se cumplan los requisitos establecidos, cualquier ciudadano podrá acceder a estas ayudas-При условии выполнения установленных требований любой гражданин сможет получить доступ к этой помощи','Dado que el informe preliminar arroja datos contradictorios, será necesario realizar una segunda auditoría-Поскольку предварительный отчёт даёт противоречивые данные, потребуется провести вторую проверку','Por muy persuasivo que sea, no logrará convencer al comité de que su plan es factible-Каким бы убедительным он ни был, ему не удастся убедить комитет в том, что его план осуществим','Huelga decir que si los responsables hubieran actuado con diligencia, se habrían evitado estas pérdidas-Излишне говорить, что если бы ответственные лица действовали добросовестно, этих потерь можно было бы избежать','No solo sería inútil, sino contraproducente, seguir invirtiendo recursos en un proyecto abocado al fracaso-Было бы не только бесполезно, но и контрпродуктивно продолжать вкладывать ресурсы в проект, обречённый на провал','Tal y como está redactado el contrato, la empresa se reserva el derecho de modificar las condiciones unilateralmente-В том виде, в котором составлен договор, компания оставляет за собой право изменять условия в одностороннем порядке','Nunca imaginé que una discusión tan trivial pudiera derivar en un conflicto tan enconado entre dos personas racionales-Я никогда не предполагал, что столь тривиальный спор может перерасти в такой ожесточённый конфликт между двумя рациональными людьми','De haber contado con el respaldo institucional, hoy la organización estaría en una posición mucho más sólida-Если бы они заручились поддержкой институтов, сегодня организация находилась бы в гораздо более прочном положении','A pesar de que los datos eran concluyentes, algunos miembros del panel se mostraron escépticos y pidieron nuevas pruebas-Несмотря на то что данные были убедительными, некоторые члены комиссии отнеслись скептически и потребовали новых доказательств','Visto el desenlace del asunto, me arrepiento de no haber intervenido cuando aún estaba a tiempo-Видя结局 этого дела, я сожалею, что не вмешался, когда ещё было время','Conscientes de la gravedad de la situación, las autoridades decretaron el estado de emergencia en toda la región-Сознавая серьёзность ситуации, власти объявили чрезвычайное положение во всём регионе','Ni que decir tiene que su actitud tan altiva no ha hecho más que empeorar las relaciones con el resto del equipo-Само собой разумеется, его высокомерное поведение только ухудшило отношения с остальной командой','Pese a haber sido advertido repetidamente, reincidió en los mismos errores, lo que le costó el puesto de trabajo-Несмотря на неоднократные предупреждения, он повторял те же ошибки, что стоило ему рабочего места','El quid de la cuestión no es quién tiene razón, sino cómo salimos de este atolladero sin más daños colaterales-Суть не в том, кто прав, а в том, как нам выбраться из этой передряги с наименьшими потерями','A poco que indagues en los archivos históricos, descubrirás que esta situación ya ocurrió hace varias décadas-Стоит тебе немного покопаться в исторических архивах, и ты обнаружишь, что эта ситуация уже случалась несколько десятилетий назад','Pero es que además de no asumir su culpa, trató de culpabilizar a sus subordinados, lo que me parece deleble-Но, помимо того что он не признал своей вины, он попытался возложить вину на подчинённых, что кажется мне предосудительным','Conforme avanza la digitalización, muchas profesiones tradicionales están desapareciendo o transformándose radicalmente-По мере развития цифровизации многие традиционные профессии исчезают или радикально трансформируются','A fin de que el proceso sea más transparente, se habilitará una plataforma online donde se publique toda la información relevante-Для большей прозрачности процесса будет создана онлайн-платформа, где будет публиковаться вся соответствующая информация','No sería la primera vez que un proyecto ambicioso fracasa por no haberse evaluado correctamente los riesgos asociados-Это не первый случай, когда амбициозный проект проваливается из-за неправильной оценки связанных с ним рисков','Tanto si estás de acuerdo como si no, la decisión ya está tomada y deberás acatarla sin excusas-Согласен ты или нет, решение уже принято, и ты должен подчиниться ему без оправданий','Por más que se empeñe en negar la evidencia, los números demuestran que su gestión ha sido nefasta para la empresa-Как бы он ни пытался отрицать очевидное, цифры показывают, что его руководство было губительным для компании','Llegados a este punto, resulta imperativo que replanteemos nuestras prioridades si no queremos quedarnos rezagados-На данный момент крайне важно пересмотреть наши приоритеты, если мы не хотим остаться позади','Tan pronto como el consejo de administración dé el visto bueno, procederemos a la firma del contrato con el proveedor-Как только совет директоров даст добро, мы приступим к подписанию контракта с поставщиком','Cabe mencionar que, pese a las críticas recibidas, el proyecto logró cumplir sus objetivos en tiempo récord-Следует упомянуть, что, несмотря на критику, проект сумел достичь своих целей в рекордные сроки','No obstante, sería un error pensar que el éxito de ayer garantiza el de mañana; debemos seguir innovando-Тем не менее было бы ошибкой полагать, что сегодняшний успех гарантирует завтрашний; мы должны продолжать внедрять инновации','Por muy fatigado que estés, te sugiero que al menos termines el informe antes de irte a casa-Каким бы уставшим ты ни был, я советую тебе хотя бы закончить отчёт перед уходом домой','Si bien es cierto que cometió un error, también lo es que nadie le ofreció la formación adecuada para evitarlo-Хотя верно, что он совершил ошибку, также верно и то, что никто не предоставил ему надлежащего обучения, чтобы этого избежать','En lugar de buscar chivos expiatorios, deberíamos analizar las causas estructurales que propiciaron esta crisis-Вместо поиска козлов отпущения, нам следовало бы проанализировать структурные причины, которые привели к этому кризису','Me temo que su propuesta, por atractiva que parezca en teoría, resulta inviable en la práctica por falta de presupuesto-Боюсь, что его предложение, сколь привлекательным оно ни кажется в теории, неосуществимо на практике из-за отсутствия бюджета','A la larga, la inversión en educación siempre acaba siendo rentable, aunque los efectos no se vean de inmediato-В долгосрочной перспективе инвестиции в образование всегда окупаются, даже если эффект виден не сразу','Que no te sorprenda si dentro de unos años este modelo de negocio queda totalmente obsoleto; la tecnología avanza muy deprisa-Не удивляйся, если через несколько лет эта бизнес-модель полностью устареет; технологии развиваются очень быстро','Fuese quien fuese el filtrador de la información, lo cierto es que los documentos públicos deberían ser accesibles sin restricciones-Кем бы ни был тот, кто слил информацию, правда в том, что публичные документы должны быть доступны без ограничений','No me parece ético que una empresa se aproveche de la vulnerabilidad de sus clientes para incrementar sus beneficios-Мне не кажется этичным, когда компания пользуется уязвимостью своих клиентов для увеличения прибыли','Si me apuras, incluso diría que la medida adoptada fue desproporcionada en relación con la gravedad real de la infracción-Если честно, я бы даже сказал, что принятая мера была непропорциональна реальной серьёзности нарушения','A base de insistir, al final conseguirá que reconsideren su postura, aunque al principio parecía imposible-Благодаря настойчивости, в конце концов ему удастся заставить их пересмотреть свою позицию, хотя сначала это казалось невозможным','Contra todo pronóstico, los dos países enfrentados lograron firmar un acuerdo de paz que ha sido muy bien recibido internacionalmente-Вопреки всем прогнозам, две враждующие страны смогли подписать мирное соглашение, которое было очень хорошо принято международным сообществом','Me alegra comprobar que, pese a las dificultades, aún hay quien lucha por mantener vivos los oficios artesanales tradicionales-Я рад убедиться, что, несмотря на трудности, ещё есть те, кто борется за сохранение традиционных ремёсел','Si te soy sincero, no termino de verle el sentido a convocar otra reunión cuando la anterior no sirvió absolutamente para nada-Если честно, я не совсем понимаю смысл созывать ещё одну встречу, когда предыдущая не принесла абсолютно никакой пользы','Teniendo en cuenta los precedentes, no me extrañaría que la empresa decidiera externalizar el servicio para abaratar costes-Учитывая прецеденты, меня бы не удивило, если бы компания решила передать услугу на аутсорсинг для удешевления','Pero si ya te lo advertí la semana pasada, no entiendo cómo puedes mplacer a todos los sectores por igual-Суть в том, что как бы мы ни старались, мы не сможем угодить всем секторам одинаково','Olvidémonos de los culpables y centrémonos en cómo reparar el daño ya causado y evitar que vuelva a suceder-Забудем о виноватых и сосредоточимся на том, как исправить уже причинённый вред и не допустить повторения','A poco que te adentres en el mundo de la investigación, descubrirás que la ciencia avanza a base de ensayo y error-Стоит тебе немного углубиться в мир исследований, как ты обнаружишь, что наука движется методом проб и ошибок','No me cabe la menor duda de que, de haber participado en el debate, habría aportado argumentos mucho más sólidos que los presentes-У меня нет ни малейших сомнений, что, если бы он участвовал в дебатах, он привёл бы гораздо более весомые аргументы, чем присутствующие','Conforme nos adentramos en la era digital, las habilidades técnicas se vuelven tan imprescindibles como saber leer y escribir-По мере погружения в цифровую эпоху технические навыки становятся такими же необходимыми, как умение читать и писать','Por muy bien preparado que estés, siempre habrá imprevistos que pondrán a prueba tu capacidad de reacción-Как бы хорошо ты ни был подготовлен, всегда будут непредвиденные обстоятельства, которые испытают твою способность реагировать','Lejos de solucionar el problema, las medidas adoptadas por el gobierno no hicieron sino agravar la situación de los más vulnerables-Вместо решения проблемы, меры, принятые правительством, лишь усугубили положение наиболее уязвимых','Puestos a invertir en formación, ¿por qué no aprovechamos los recursos públicos para crear una plataforma educativa abierta a todos? Если уж вкладывать средства в образование, почему бы нам не использовать государственные ресурсы для создания образовательной платформы, открытой для всех?','Cabe destacar que, pese a su corta edad, la joven científica ha publicado artículos en revistas de alto impacto-Следует отметить, что, несмотря на юный возрас
